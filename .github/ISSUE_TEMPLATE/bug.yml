name: Bug report
description: Something in Siverse doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, don't use this form: see SECURITY.md.
        Please remove any API keys, personal paths or company data from logs and screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run npm run dev
        2. ...
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: e.g. v22.11.0
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      description: Settings > AI office engine
      options:
        - Claude API (API key)
        - Claude Code on this computer
        - Not using the AI office
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Watch Claude Code
        - AI office
        - Demo mode (npm run demo)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output from the terminal, or errors from the browser console.
      render: text
